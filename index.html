<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <br>
    <center><h1>BMI Generator</h1>
    <form id="user">
        <label>Height in CM :</label>
        <input type="text" id="height"><br><br>
        <label>Weight in KG :</label>
        <input type="text" id="weight"><br><br>
        <button id="button">Calculate</button>
    </form>
    <div class="result"></div>
</center>
<br>
    <div class="default">
        <h3 class="para" id="guide"><i>BMI Weight Guide</i></h3>
        <p class="para">Under Weight=Less than 18.5</p>
        <p class="para">Normal Range= 18.5 to 24.9</p>
        <p class="para">Overweight=Greater than 24.9</p>
    </div>
</body>
<script src="index.js"></script>
</html>
